name: Candidate 0.2.83 Windows QA

on:
  workflow_dispatch:

permissions:
  # GitHub hides draft releases from read-only tokens. The job only downloads
  # frozen assets; it contains no release publication or promotion command.
  contents: write

jobs:
  install-update-startup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed QA helper
        uses: actions/checkout@v4
      - name: Download the exact unpublished candidate and production baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $latest = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.id -ne 442233846 -or $latest.tag_name -ne 'v0.2.78') { throw 'Production baseline changed.' }
          $draft = gh release view v0.2.83 --repo $repo --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Expected an unpublished candidate.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline'
          New-Item -ItemType Directory -Path $candidate,$baseline | Out-Null
          gh release download v0.2.83 --repo $repo --dir $candidate --pattern 'UpTax-Setup-0.2.83.exe' --pattern 'UpTax-Setup-0.2.83.exe.blockmap' --pattern 'latest.yml'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed.' }
          gh release download v0.2.78 --repo $repo --dir $baseline --pattern 'UpTax-Setup-0.2.78.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed.' }
      - name: Verify install, same-directory upgrade, login startup, and uninstall
        shell: pwsh
        run: |
          & .github/scripts/test-candidate-0283-windows.ps1 -CandidateDirectory "$env:RUNNER_TEMP/candidate" -BaselineInstaller "$env:RUNNER_TEMP/baseline/UpTax-Setup-0.2.78.exe" -OutputDirectory "$env:RUNNER_TEMP/qa-results"
      - name: Retain sanitized operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-0283-windows-qa
          path: ${{ runner.temp }}/qa-results/windows-install-qa.json
          if-no-files-found: warn
