name: Candidate 0.2.79 Windows QA

on:
  pull_request:
    paths:
      - '.github/workflows/candidate-0279-windows-qa.yml'
  workflow_dispatch:

permissions:
  # GitHub hides draft releases from read-only tokens. The job only downloads
  # frozen assets; it contains no release publication or promotion command.
  contents: write

jobs:
  install-update-startup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the exact unpublished candidate and production baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $latest = gh api "repos/$repo/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latest -ne 'v0.2.78') { throw 'Production baseline changed.' }
          $draft = gh release view v0.2.79 --repo $repo --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Expected an unpublished candidate.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          $baseline = Join-Path $env:RUNNER_TEMP 'baseline'
          New-Item -ItemType Directory -Path $candidate,$baseline | Out-Null
          gh release download v0.2.79 --repo $repo --dir $candidate --pattern 'UpTax-Setup-0.2.79.exe' --pattern 'UpTax-Setup-0.2.79.exe.blockmap' --pattern 'latest.yml' --pattern 'candidate-manifest.json' --pattern 'test-candidate-windows.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed.' }
          gh release download v0.2.78 --repo $repo --dir $baseline --pattern 'UpTax-Setup-0.2.78.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed.' }
          $pins = @{
            'candidate-manifest.json' = '79e41956b73b3d18c964cefc62c331f6082afb7be9a58a507effc67f7748537a'
            'test-candidate-windows.ps1' = '8960780a77591a4af55970587c11ca04377c23c3ab259b135a78cd7291494c7c'
          }
          foreach ($name in $pins.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path $candidate $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins[$name]) { throw 'Frozen QA input differs.' }
          }
      - name: Verify install, same-directory upgrade, login startup, and uninstall
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/candidate/test-candidate-windows.ps1" -CandidateDirectory "$env:RUNNER_TEMP/candidate" -BaselineInstaller "$env:RUNNER_TEMP/baseline/UpTax-Setup-0.2.78.exe" -OutputDirectory "$env:RUNNER_TEMP/qa-results"
      - name: Retain sanitized operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-0279-windows-qa
          path: ${{ runner.temp }}/qa-results/windows-install-qa.json
          if-no-files-found: warn
